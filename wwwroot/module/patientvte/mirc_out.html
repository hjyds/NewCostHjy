<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医保管控结果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #3671d9;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-icon {
            font-size: 18px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 500;
        }
        .toolbar {
            background-color: #fff3f3;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .toolbar-left span {
            margin-right: 16px;
        }
        .toolbar-left .red {
            color: #f5222d;
        }
        .toolbar-right .btn-tag {
            padding: 4px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            margin-left: 8px;
            cursor: pointer;
        }
        .toolbar-right .btn-tag.orange {
            background-color: #fff2e0;
            border-color: #ff9800;
            color: #ff9800;
        }
        .toolbar-right .icon-btn {
            margin-left: 8px;
            width: 24px;
            height: 24px;
            border: none;
            background: #e8f3ff;
            color: #3671d9;
            border-radius: 4px;
            cursor: pointer;
        }
        .table-container {
            padding: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th, table td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        table th {
            background-color: #fafafa;
            font-weight: 500;
            color: #666;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
        }
        .tag-control {
            background-color: #9254de;
        }
        .tag-insurance {
            background-color: #3671d9;
        }
        .tag-tip {
            background-color: #e6f7ff;
            color: #3671d9;
            border: 1px solid #91d5ff;
        }
        .tag-green {
            background-color: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .red-text {
            color: #f5222d;
        }
        .radio-group label {
            display: block;
            margin: 4px 0;
            cursor: pointer;
        }
        .reason-area {
            margin: 16px;
        }
        .reason-area textarea {
            width: 100%;
            height: 60px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            font-size: 14px;
            background-color: #f5f5f5;
        }
        .quick-buttons {
            padding: 0 16px 16px;
            display: flex;
            gap: 12px;
        }
        .quick-buttons button {
            padding: 4px 12px;
            border: 1px solid #3671d9;
            background: white;
            color: #3671d9;
            border-radius: 4px;
            cursor: pointer;
        }
        .quick-buttons button.blue {
            background-color: #3671d9;
            color: white;
        }
        .action-buttons {
            padding: 16px;
            text-align: right;
            display: flex;
            justify-content: flex-end;
            gap: 16px;
        }
        .action-buttons button {
            padding: 8px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .action-buttons .btn-blue {
            background-color: #3671d9;
            color: white;
        }
        .action-buttons .btn-red {
            background-color: #f5222d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <span class="header-icon">🅳</span>
            <span class="header-title">医保管控结果 (2项)</span>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <span>违规项目：0项</span>
                <span>提示项目：3项</span>
                <span class="red">违规金额：¥233.75</span>
                <span>来源统计：<button class="btn-tag" style="background-color:#e8f3ff; color:#3671d9; border-color:#3671d9;">医保 1</button><button class="btn-tag" style="background-color:#f6ffed; color:#52c41a; border-color:#52c41a;">管控 2</button></span>
            </div>
            <div class="toolbar-right">
                <span>一键标记:</span>
                <button class="btn-tag orange">全部自费</button>
                <button class="btn-tag">全部报销</button>
                <button class="icon-btn">▦</button>
                <button class="icon-btn">🟦</button>
            </div>
        </div>

        <!-- 表格 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>费用项目</th>
                        <th>来源</th>
                        <th>提示类型</th>
                        <th>提示内容</th>
                        <th>严重程度</th>
                        <th>金额</th>
                        <th>违规依据</th>
                        <th>报销方式</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>尿流率检测</td>
                        <td><span class="tag tag-control">管控</span><br><span class="tag tag-insurance">医保</span></td>
                        <td><span class="tag tag-green">报销提示</span><br><span class="tag tag-green">报销提示</span></td>
                        <td>尿液分析与尿沉渣镜检功能相同<br>疑似医生在电子处方中误操作</td>
                        <td><span class="tag tag-tip">提示</span><br><span class="tag tag-tip">提示</span></td>
                        <td class="red-text">¥221.00</td>
                        <td>自定义<br>药品费用</td>
                        <td>
                            <label><input type="radio" name="reimburse1" checked> 医保自费</label>
                            <label><input type="radio" name="reimburse1"> 报销</label>
                        </td>
                    </tr>
                    <tr>
                        <td>尿液分析 (11项)</td>
                        <td><span class="tag tag-control">管控</span></td>
                        <td><span class="tag tag-green">报销提示</span></td>
                        <td>尿液分析与尿沉渣镜检功能相同</td>
                        <td><span class="tag tag-tip">提示</span></td>
                        <td class="red-text">¥12.75</td>
                        <td>自定义</td>
                        <td>
                            <label><input type="radio" name="reimburse2" checked> 医保自费</label>
                            <label><input type="radio" name="reimburse2"> 报销</label>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 原因输入框 -->
        <div class="reason-area">
            <textarea readonly>患者病情需要，该药物为治疗必需。</textarea>
        </div>

        <!-- 快速原因按钮 -->
        <div class="quick-buttons">
            <span style="font-size:13px; color:#666;">快速填入原因:</span>
            <button class="blue">病情需要</button>
            <button>指南推荐</button>
            <button>无违规信息</button>
        </div>

        <!-- 操作按钮 -->
        <div class="action-buttons">
            <button class="btn-blue">遵从(返回修改)</button>
            <button class="btn-red">不遵从(继续执行)</button>
        </div>
    </div>
</body>
</html>
